<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 4 Must Reads</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<main class="wrap">
  <nav class="nav"><a href="index.html">← Home</a><a href="exam.html?id=1">Mock 1</a><a href="exam.html?id=2">Mock 2</a><a href="exam.html?id=3">Mock 3</a></nav>
  <article id="doc" class="md">Loading…</article>
</main>
<script>
fetch('must-reads.md')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { document.getElementById('doc').innerHTML = marked.parse(t); })
  .catch(() => { document.getElementById('doc').innerHTML = '<p>Could not load the notes. Open <a href="must-reads.md">must-reads.md</a> directly.</p>'; });
</script>
</body>
</html>
